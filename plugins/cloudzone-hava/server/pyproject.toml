[project]
name = "hava-mcp"
version = "0.4.1"
description = "MCP server for Hava (hava.io) cloud architecture diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Claude Desktop can fall back to initialize after a discovery timeout.
    # Keep the desktop release on the handshake protocol until that is fixed.
    "mcp==1.30.0",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
hava-mcp = "hava_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hava_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
